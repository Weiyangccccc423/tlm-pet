modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 本模组是 TLM 的附属模组，必须在它之后加载。
# 官方附属模组模板漏了这一项，但我们的 mixin 直接指向 TLM 的内部类
# （MaidEventTrigger / AltarCraftTrigger / EntityMaid），缺失时应当明确报错而不是静默降级。
[[dependencies."${mod_id}"]]
modId = "touhou_little_maid"
mandatory = true
versionRange = "${tlm_version_range}"
ordering = "AFTER"
side = "BOTH"
