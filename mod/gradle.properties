org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false

# ---- Minecraft / Forge ----
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.0
forge_version_range=[47,)
loader_version_range=[47,)

# ---- 映射 ----
# 必须与 TLM 本体一致（TLM build.gradle:36 用的就是 parchment 2023.08.20-1.20.1）。
# 混用不同映射会让 mixin 的 refmap 解析到错误的方法名。
mapping_channel=parchment
mapping_version=2023.08.20-1.20.1

# ---- 本模组 ----
mod_id=tlm_pet
mod_name=Touhou Little Maid: Bond
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.tlmpet
mod_authors=
mod_description=Carries your maid across worlds through a desktop pet companion. An addon for Touhou Little Maid.

# ---- 依赖的 TLM（CurseMaven）----
# 8061847 = touhoulittlemaid-1.5.3-forge+mc1.20.1.jar
#   查证方式：https://api.cfwidget.com/355044 的 files 数组
#   ⚠️ 官方附属模组模板 TartaricAcid/TLMAdditionExample@master 用的是 6613821，
#      那是 TLM 1.3.5（2023 年），缺 ToolRegister / SkillLoader / MaidBackupsManager /
#      MaidTamedEvent / MaidAndItemTransformEvent 等一大批类。不要照抄模板的这个 id。
# 不带 -sources- 是因为本机保有 TLM 完整源码 checkout，读代码比 sources jar 更方便。
tlm_file_id=8061847
tlm_version_range=[1.5.0,)

